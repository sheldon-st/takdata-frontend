# Production deployment — uses pre-built images from GitHub Container Registry.
# Traefik routes both services behind data.opengeo.space:
#   frontend: Host(`data.opengeo.space`)
#   backend:  Host(`data.opengeo.space`) && PathPrefix(`/api`)
# Run: docker compose pull && docker compose up -d

services:
  backend:
    image: ghcr.io/sheldon-st/takdata:latest
    restart: unless-stopped
    volumes:
      - tak-data:/app/data
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATA_DIR=/app/data
      - CORS_ORIGINS=${CORS_ORIGINS:-["https://data.opengeo.space"]}
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.takdata-api.rule=Host(`data.opengeo.space`) && PathPrefix(`/api`)
      - traefik.http.routers.takdata-api.entrypoints=websecure
      - traefik.http.routers.takdata-api.tls.certresolver=letsencrypt
      - traefik.http.routers.takdata-api.priority=100
      - traefik.http.services.takdata-api.loadbalancer.server.port=8000
      - traefik.http.routers.takdata-api.middlewares=authentik-fwd@docker

  frontend:
    image: ghcr.io/sheldon-st/takdata-frontend:latest
    restart: unless-stopped
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.takdata-ui.rule=Host(`data.opengeo.space`)
      - traefik.http.routers.takdata-ui.entrypoints=websecure
      - traefik.http.routers.takdata-ui.tls.certresolver=letsencrypt
      - traefik.http.services.takdata-ui.loadbalancer.server.port=3000
      - traefik.http.routers.takdata-ui.middlewares=authentik-fwd@docker
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - backend

volumes:
  tak-data:

networks:
  dokploy-network:
    external: true

# Production deployment (Dokploy + Traefik + Authentik) using the images
# published to GHCR by each repo's "Publish image" workflow.
#
# Traefik routes both services on one host:
#   backend:  Host(`data.opengeo.space`) && PathPrefix(`/api`)
#   frontend: Host(`data.opengeo.space`)
# Both routers go through the `authentik-fwd` forward-auth middleware.
#
# Pin TAKDATA_TAG to a release (e.g. 1.0.0) for repeatable deploys.
# See https://github.com/sheldon-st/takdata/blob/main/DEPLOY.md

services:
  backend:
    image: ghcr.io/sheldon-st/takdata:${TAKDATA_TAG:-latest}
    restart: unless-stopped
    volumes:
      - tak-data:/app/data
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - AISSTREAM_API_KEY=${AISSTREAM_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-["https://data.opengeo.space"]}
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.takdata-api.rule=Host(`data.opengeo.space`) && PathPrefix(`/api`)
      - traefik.http.routers.takdata-api.entrypoints=websecure
      - traefik.http.routers.takdata-api.tls.certresolver=letsencrypt
      - traefik.http.routers.takdata-api.priority=100
      - traefik.http.routers.takdata-api.middlewares=authentik-fwd@docker
      - traefik.http.services.takdata-api.loadbalancer.server.port=8000

  frontend:
    image: ghcr.io/sheldon-st/takdata-frontend:${TAKDATA_TAG:-latest}
    restart: unless-stopped
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.takdata-ui.rule=Host(`data.opengeo.space`)
      - traefik.http.routers.takdata-ui.entrypoints=websecure
      - traefik.http.routers.takdata-ui.tls.certresolver=letsencrypt
      - traefik.http.routers.takdata-ui.middlewares=authentik-fwd@docker
      - traefik.http.services.takdata-ui.loadbalancer.server.port=3000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  tak-data:

networks:
  dokploy-network:
    external: true
